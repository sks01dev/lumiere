[project]
name = "lumiere"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivam", email = "sswarnkar0001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "google-genai>=3.3.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.6.0",
]

[project.scripts]
lumiere = "lumiere:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
